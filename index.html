<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finans">
<meta name="theme-color" content="#0f5c6e">
<title>Finans Robotu - Mobil</title>
<!-- Telefon sürümü · kaynak: src\ (derle.ps1 ile üretilir; bu dosyayı doğrudan düzenleme) -->
<style>
/* ===== Tasarım sistemi (23.10.2026): aydınlık, sade; beyaz / açık gri yüzey, antrasit metin, yeşil vurgu =====
   Renkler yalnızca buradaki değişkenlerden gelir; koyu tema aynı değişkenleri yeniden tanımlar.
   --c-in / --c-out / --c-net: grafiklerde giren, çıkan, net (renk tek başına anlam taşımaz; her grafikte yazılı açıklama vardır) */
:root{--bg:#f2f5f3;--sf:#fff;--sf2:#f7f9f8;--ink:#1d2a2f;--ink2:#3a4a50;--mu:#66757b;--ln:#e1e7e4;--ln2:#edf1ef;--ac:#17694f;--ach:#11573f;--act:#e6f2ec;--aci:#fff;--hero:#1e4a40;--heroi:#f1f7f4;--bad:#b3402f;--badt:#fbecea;--warn:#946000;--warnt:#fbf3e2;--ok:#1b7550;--okt:#e5f2eb;--inf:#3b6a8e;--inft:#eaf1f7;--c-in:#1f7a5c;--c-out:#e07a5f;--c-net:#2f3b40;--sh:0 1px 2px rgba(20,32,28,.04),0 4px 14px rgba(20,32,28,.05);--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--sf:#17201d;--sf2:#1c2723;--ink:#e3ebe7;--ink2:#c3cfca;--mu:#93a29c;--ln:#2a3833;--ln2:#22302b;--ac:#4cc497;--ach:#6fd3ad;--act:#1b362d;--aci:#06241a;--hero:#1a3a31;--heroi:#e9f4ef;--bad:#ef8a7c;--badt:#3a2220;--warn:#e2ad55;--warnt:#36291a;--ok:#64d1a0;--okt:#183327;--inf:#8ab8dc;--inft:#1c2a36;--c-in:#4cc497;--c-out:#ee9a83;--c-net:#d3ddd8;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101715;--sf:#17201d;--sf2:#1c2723;--ink:#e3ebe7;--ink2:#c3cfca;--mu:#93a29c;--ln:#2a3833;--ln2:#22302b;--ac:#4cc497;--ach:#6fd3ad;--act:#1b362d;--aci:#06241a;--hero:#1a3a31;--heroi:#e9f4ef;--bad:#ef8a7c;--badt:#3a2220;--warn:#e2ad55;--warnt:#36291a;--ok:#64d1a0;--okt:#183327;--inf:#8ab8dc;--inft:#1c2a36;--c-in:#4cc497;--c-out:#ee9a83;--c-net:#d3ddd8;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:40px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:64px 16px 16px}
h1{font-size:26px;line-height:1.15;margin:6px 0 4px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
main h1{margin-bottom:14px}
.pg h1{margin-bottom:2px}
h2{font-size:16px;margin:26px 0 10px;font-weight:600;letter-spacing:-.005em}
h3{font-size:12px;margin:16px 0 6px;color:var(--mu);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
p{margin:8px 0}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
a{color:var(--ac)}

/* Kartlar ve satırlar */
.st{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);min-width:0}
.st.lk{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.st.lk:hover{border-color:var(--ac)}
.st small{color:var(--mu);display:block;font-size:13px}
.st>small:first-child{font-weight:500;color:var(--ink2);margin-bottom:2px}
.st b{font-size:22px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.25}
.st small+b{margin-top:2px}
.it{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:var(--sh)}
.it.dim{opacity:.6}
details.it>summary{list-style:none;cursor:pointer;color:inherit;font-size:inherit;padding:0}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary .hd{margin-bottom:0}
details.it>summary .hd b::before{content:"▸ ";color:var(--mu)}
details.it[open]>summary .hd{margin-bottom:8px}
details.it[open]>summary .hd b::before{content:"▾ "}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;margin-bottom:8px}
.hd>b{font-size:15px;font-weight:600}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--ln2)}
.ln:first-child{border-top:0}
.ln>span:first-child{color:var(--mu);min-width:0}
.ln>span:last-child{text-align:right;overflow-wrap:break-word}
.e{font-style:normal;color:var(--warn)}
.bd{display:inline-block;font-size:12px;font-weight:500;line-height:20px;border-radius:20px;padding:0 9px;color:var(--ink2);background:var(--ln2);white-space:nowrap}
.bd.r{color:var(--bad);background:var(--badt)}
.bd.g{color:var(--ok);background:var(--okt)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ac);font-size:13px;font-weight:500;padding:4px 0}
.spark{width:100%;height:60px;display:block;margin-top:6px}
.chart{width:100%;height:170px;display:block}
.chl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:2px}
.kb{font-size:11px;font-weight:500;opacity:.7;margin-left:6px;border:1px solid currentColor;border-radius:4px;padding:0 4px}
@media (max-width:899px){.kb{display:none}}

/* Düğmeler ve form öğeleri */
button,select,input{font:inherit;color:var(--ink)}
input,select{font-size:16px}
button{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:#c9d3cf;background:var(--sf2)}
button.p{background:var(--ac);color:var(--aci);border-color:var(--ac)}
button.p:hover{background:var(--ach);border-color:var(--ach)}
button.sm{min-height:30px;padding:3px 10px;font-size:13px;border-radius:8px}
button.tile{text-align:left;display:block;width:100%;padding:14px 16px;border-radius:var(--r);box-shadow:var(--sh)}
button.tile b{font-weight:600}
button.tile small{display:block;color:var(--mu);font-size:13px;margin-top:3px;font-weight:400}
button.tile:hover{border-color:var(--ac)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible,.st.lk:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* Alt sekmeler: alt çizgili sekme çubuğu */
.sub{display:flex;gap:2px;margin:4px 0 16px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--ln)}
.sub button{white-space:nowrap;background:none;border:0;border-radius:8px 8px 0 0;color:var(--mu);padding:10px 14px;min-height:42px;box-shadow:inset 0 -2px transparent}
.sub button:hover{color:var(--ink);background:none}
.sub button.on{color:var(--ac);font-weight:600;box-shadow:inset 0 -2px var(--ac);background:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chips button{min-height:32px;padding:4px 14px;border-radius:20px;font-size:13px;background:var(--sf)}
.chips button.on{border-color:var(--ac);color:var(--ac);background:var(--act);font-weight:600}
label{display:block;margin:10px 0 4px;color:var(--ink2);font-size:13px;font-weight:500}
input:not([type=checkbox]):not([type=radio]),select{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);min-height:42px;transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--act);outline:none}
input[type=checkbox],input[type=radio]{accent-color:var(--ac);width:17px;height:17px;flex:none}
label.ck{display:inline-flex;gap:6px;align-items:center;margin:0;color:var(--ok)}
label.cb{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;font-weight:400;margin:10px 0}
option[value="__new"]{font-weight:600}

/* Tablolar */
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 10px;font-size:13px;border-bottom:1px solid var(--ln2);text-align:right}
tr:last-child>td{border-bottom:0}
th{background:var(--sf2);color:var(--mu);font-weight:600;font-size:12px;letter-spacing:.03em}
td:first-child,th:first-child{text-align:left}
td input{min-width:70px}
table.tb td,table.tb th{text-align:left;padding:9px 12px;vertical-align:middle}
table.tb th{white-space:nowrap;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
table.tb .n{text-align:right;white-space:nowrap}
table.tb .x{text-align:right;white-space:nowrap}
table.tb .x button{margin-left:4px}
table.tb tr:hover td{background:var(--sf2)}
button.th{background:none;border:0;padding:0;min-height:0;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-transform:inherit;letter-spacing:inherit}

/* Yan menü ve üst çubuk */
nav{position:fixed;top:0;bottom:0;left:0;width:248px;max-width:80vw;z-index:15;display:flex;flex-direction:column;gap:2px;background:var(--sf);border-right:1px solid var(--ln);padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s;overflow-y:auto}
nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
nav .brand i{width:36px;height:36px;border-radius:10px;background:var(--ac);color:var(--aci);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:17px;flex:none}
nav .brand b{display:block;font-size:16px;line-height:1.2}
nav .brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
nav .ns{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600;padding:8px 12px 6px}
nav button{border:0;background:none;text-align:left;padding:10px 12px;font-size:15px;border-radius:10px;width:100%;display:flex;align-items:center;gap:12px;color:var(--ink2);min-height:42px}
nav button:hover{background:var(--sf2)}
nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
nav button .nl{flex:1}
nav button.on{background:var(--act);color:var(--ac);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
nav .kb{margin-top:0;color:var(--mu)}
nav .nf{margin-top:auto;border-top:1px solid var(--ln);padding-top:10px}
nav .priv{font-size:12px;color:var(--mu);padding:8px 12px 2px;display:flex;gap:8px;align-items:center}
nav .priv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
body.open nav{transform:none;visibility:visible}
#top{display:none}
#mn,#gz{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:16;width:42px;padding:0;font-size:19px}
#mn{left:10px}#gz{right:10px}
#bk{display:none;position:fixed;inset:0;background:rgba(15,25,22,.4);z-index:14}
body.open #bk{display:block}
body.locked #mn,body.locked #gz,body.locked nav,body.locked #bk,body.locked #top{display:none!important}
body.locked main{margin:0 auto!important}

/* Grafikler, uyarılar */
.bar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--ln2);margin:8px 0}
.bar i{display:block;border-radius:6px}
.w{border:1px solid transparent;border-left:3px solid var(--warn);border-radius:10px;padding:9px 12px;margin:6px 0;background:var(--warnt);color:var(--ink);font-size:14px}
.w.r{border-left-color:var(--bad);background:var(--badt)}
.w.i{border-left-color:var(--inf);background:var(--inft)}
.pie{display:flex;align-items:center;gap:18px}
.pie svg{width:120px;height:120px;flex:none;transform:rotate(-90deg)}
.pie>div{flex:1;min-width:0}

/* Pencereler: #m ana pencere, #m2 onun üstünde açılan "yeni kayıt" penceresi */
#m,#m2{position:fixed;inset:0;background:rgba(15,25,22,.45);display:none;overflow:auto;z-index:20}
#m2{z-index:22;background:rgba(15,25,22,.3)}
#m>div,#m2>div{background:var(--sf);margin:5vh auto;max-width:480px;padding:22px 24px;border-radius:18px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(15,25,22,.25);border:1px solid var(--ln)}
#m>div>h2:first-child,#m2>div>h2:first-child{font-size:19px;margin-top:0;padding-bottom:12px;border-bottom:1px solid var(--ln2)}
#m2>div{max-width:400px;margin-top:12vh}

/* Geniş ekran (PC) düzeni */
@media (min-width:900px){
  #bk{display:none!important}
  body.open main,body.open #top{margin-left:248px}
  main{max-width:1360px;padding:8px 32px 32px}
  #top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1360px;padding:18px 32px 6px;position:relative}
  #top .tt small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600}
  #top .tt b{font-size:13px;color:var(--ink2);font-weight:500}
  #top .tr{display:flex;align-items:center;gap:8px;padding-right:100px}
  #top .per{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;min-height:40px;background:var(--sf);font-weight:500;font-size:14px}
  #mn{display:none}
  #gz,#th{top:calc(18px + env(safe-area-inset-top,0px));bottom:auto}
  #gz{right:32px}#th{right:80px;left:auto}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
  .cols>div>h2:first-child{margin-top:4px}
  #m>div{max-width:760px}
  .fl{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .fl>.full{grid-column:1/-1}
  .it{padding:16px 18px}
  .setg{grid-template-columns:repeat(3,1fr)}
}

/* Tema düğmesi, hızlı işlem düğmesi ve menüsü */
#th{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:58px;z-index:16;width:42px;padding:0;font-size:17px}
#fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:17;width:56px;height:56px;border-radius:16px;padding:0;font-size:28px;line-height:1;background:var(--ac);color:var(--aci);border-color:var(--ac);box-shadow:0 8px 22px rgba(23,105,79,.35)}
#fab:hover{background:var(--ach)}
#fabm{display:none;position:fixed;right:24px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:17;flex-direction:column;align-items:stretch;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(15,25,22,.18);min-width:230px}
#fabm.on{display:flex}
#fabm button{border:0;text-align:left;white-space:nowrap;border-radius:9px}
body.locked #th,body.locked #fab,body.locked #fabm{display:none!important}
@media (min-width:900px){#gz,#th{top:calc(18px + env(safe-area-inset-top,0px));bottom:auto;left:auto}#gz{right:32px}#th{right:80px}}
main{padding-bottom:96px}
/* Sürükle-bırak sıralama */
[data-dg]{cursor:grab}
.hdl{color:var(--mu);margin-right:6px;user-select:none}
.drag{opacity:.45}
.dragover{outline:2px dashed var(--ac);outline-offset:2px}

/* Etiket, filtre, metin alanı, takvim */
button.tag{min-height:0;padding:0 8px;margin:0 2px;border-radius:10px;font-size:12px;color:var(--ac);border-color:transparent;background:var(--act);vertical-align:baseline}
details.flt{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 14px;margin:8px 0}
details.flt>summary{font-size:14px}
.fl4{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (min-width:900px){.fl4{grid-template-columns:2fr 1fr 1fr 1.4fr}}
textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink)}
.tagl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-style:normal;font-size:11px;color:var(--mu);text-align:center;font-weight:600}
.cd{min-height:44px;padding:4px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:12px;border-radius:8px;border-color:var(--ln2)}
.cd.td{border-color:var(--ac);color:var(--ac);font-weight:600}
.cd.sel{outline:2px solid var(--ac);outline-offset:-1px}
.cd.dn{opacity:.5}
.dots{display:flex;gap:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.dot.gelir{background:var(--c-in)}.dot.odeme{background:var(--bad)}.dot.kart{background:var(--warn)}

/* Genel bakış (Özet) ekranı */
.pg{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.pg p{margin:2px 0 0}
.kpi{display:grid;gap:14px;grid-template-columns:1fr}
.hx{background:var(--hero);color:var(--heroi);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);min-width:0}
.hx small{display:block;color:var(--heroi);opacity:.8;font-size:13px}
.hx .v{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:4px 0}
.hx .v .ok,.hx .v .bad{color:inherit}
.hx .hl{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:13px}
.hx .hl span{opacity:.85}.hx .hl b{font-weight:600;margin-left:6px}
.hx svg{width:100%;height:52px;display:block;margin-top:6px}
.hx button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:var(--heroi)}
.hx button:hover{background:rgba(255,255,255,.18)}
.kc{position:relative}
.kc .ic{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--act);color:var(--ac);font-size:15px}
.kc .ic.o{background:var(--badt);color:var(--c-out)}
.kc .ic.n{background:var(--inft);color:var(--inf)}
.pnl{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);min-width:0}
.pnl>h2:first-child{margin:0 0 2px}
.pnl>h2:first-child+p.mu{margin:0 0 12px;font-size:13px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.ph h2{margin:0}
.ph p{margin:2px 0 0;font-size:13px}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:4px 0 6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cf{width:100%;height:220px;display:block}
.cf text{font:11px "IBM Plex Sans",system-ui,sans-serif;fill:var(--mu)}
.fs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px;padding-top:12px;border-top:1px solid var(--ln2)}
.fs small{display:block;color:var(--mu);font-size:12px}.fs b{font-size:17px;font-weight:600}
.bp{padding:8px 0;border-top:1px solid var(--ln2)}.bp:first-of-type{border-top:0}
.bp .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bp .t b{font-weight:600}.bp .t span{color:var(--mu);white-space:nowrap}

/* Kart dönemi: en son kesim tarihi (bugün veya öncesi); dönem anahtarı kesimin ayıdır */

const prevKesim = o => { const t = lastKesim(o); return mDay(t.getFullYear(), t.getMonth() - 1, clampDay(o.kesim)) };
const perKey = o => fmtD(lastKesim(o)).slice(0, 7);

/* Yeni kart kaydı: ekstre dönemi ve son ödeme günü hazırlanır */

  delete o.asgari;

/* Taksitler: detay girilmişse detaydan, yoksa karttaki toplamlardan */
const tksOf = (o, st = S) => live(st.tks).filter(t => t.kart === o.id && t.no <= t.top);

/* KART BAKİYE KURALI (tek yer):
   cardBal  = toplam borç = güncel borç + nakit avans + gelecek taksitler → borç toplamı, net varlık, kullanılabilir limit
   cardDebt = ödenebilir güncel borç = güncel borç (eksiye düşmez) + nakit avans; gelecek taksitler HARİÇ → "tüm borcu öde", yapılandırma, yalnızca asgari senaryosu
   Kart harcaması: ekstre esas modda ekstreyle, harcama esas modda anında borca yazılır; nakit akışında kart harcaması değil kart ödemesi (asgari/dönem borcu) sayılır */
const cardBal = (o, st = S) => o.borc + o.avans + tksKal(o, st);

/* Ödemeler: per = kartta ekstre dönemi, diğerlerinde ödeme ayı */
const pays = (id, per, st = S) => live(st.odm).filter(x => x.ref === id && (per == null || x.per === per));
const paidSum = (id, per, st = S) => sum(pays(id, per, st), x => x.tut);
/* DÖNEM KURALI: kredi, KMH, elden borç ve alacak ödemeleri ödeme tarihinin bütçe dönemine (ay başlangıcı ayarı) sayılır.
   Kart ödemeleri ekstre dönemine (o.ekst), gelir onayları vade ayına bağlıdır (per alanı). */
const stBas = st => st && st.set && st.set.ayBas || 1;
const stCP = st => perOf(tod(), stBas(st));
const payPer = (x, st) => x.tar ? perOf(x.tar, stBas(st)) : x.per;
const perPays = (id, per, st = S) => live(st.odm).filter(x => x.ref === id && payPer(x, st) === per);
const perPaid = (id, per, st = S) => sum(perPays(id, per, st), x => x.tut);
const monthPaid = (o, st = S) => perPaid(o.id, stCP(st), st);

function eldenMin(o) {

function debts(st = S) {
  const D = [], p = st.p;

/* Öncelikli elden borçlar her stratejide öne alınır */
const ORD = {avalanche: (a, b) => b.r - a.r, snowball: (a, b) => a.bal - b.bal, cash: (a, b) => b.min / b.bal - a.min / a.bal};

/* Aylık bütçe sabit kalır; kart asgarisi her ay kalan borca göre yeniden hesaplanır, boşalan tutar sıradaki borca gider */
function sim(D, extra, lump, strat) {
  D = D.map(d => ({...d}));
  let pd = 0, int = 0, int12 = 0, m = 0, L = lump;
  const ord = ordFor(strat), budget = D.reduce((s, d) => s + d.min, 0) + extra;
  const pay = (d, x) => { x = Math.min(x, d.bal); d.bal -= x; pd += x; return x };
  while (D.some(d => d.bal > .5) && m < 600) {
    m++;

    if (L > 0) [...D].sort(ord).forEach(d => { if (d.bal > 0 && L > 0) L -= pay(d, L) });
    let b = budget;
    D.forEach(d => { if (d.bal > 0) b -= pay(d, Math.min(b, d.pct ? Math.round(d.bal * d.pct) : d.min)) });
    [...D].sort(ord).forEach(d => { if (b > 0 && d.bal > 0) b -= pay(d, b) });
    D.forEach(d => { if (d.kap == null && d.bal <= .5) d.kap = m }); // borcun kapandığı ay (yol haritası)
    if (m === 12) int12 = int; // ilk 12 ayın faizi (karar laboratuvarı)
  }
  if (D.some(d => d.bal > 1)) return null;
  if (m < 12) int12 = int;
  return {m, int: Math.round(int), int12: Math.round(int12), paid: Math.round(pd), kap: D.map(d => ({id: d.id, ad: d.ad, ay: d.kap || 0})).sort((a, b) => a.ay - b.ay)};

/* Kartta yalnızca asgari ödenirse (taksitler hariç; 100 TL altı kalınca tamamı ödenir) */

/* Eşit taksitli kredi; rate aylık %, KKDF ve BSMV eklenir */

/* DÖNEM FAİZİ KURALI (kredi, elden borç, KMH — 23.10.2026): faiz her bütçe döneminde BİR KEZ alınır.
   Dönem = ödeme tarihinin bütçe dönemi (payPer, ay başlangıcı ayarı). Dönem faizi = ödeme anındaki kalan anapara (KMH'de kullanılan
   tutar) × vergili aylık oran (er: aylık oran × (1 + KKDF + BSMV)), kuruşa yuvarlanır; o dönemde önceki ödemelerle alınmış faiz düşülür.
   Gün sayısı yöntemi kullanılmaz (aylık oran); bankanın gün bazlı hesabı farklı olabilir — tutarlar tahmindir. Ödeme önce kalan dönem
   faizine, sonra anaparaya sayılır. Kredi kartı bu kuralın dışındadır (kart faizi ekstreyle gelir). */
const perFaiz = (o, per, st = S) => sum(perPays(o.id, per, st), x => toN(x.faiz));
const dueFaiz = (base, o, per, st = S) => Math.max(0, Math.round(base * er(o, st.p)) - perFaiz(o, per, st));
/* Borca ödeme (veya alacağa tahsilat) uygular; değişiklikler fx'e yazılır ki geri alınabilsin. tar: ödeme tarihi (faiz dönemini belirler) */
function applyPay(c, o, tut, st = S, tar = tod()) {
  const fx = {}, add = (f, d) => { if (d) { o[f] += d; fx[f] = (fx[f] || 0) + d } }, per = perOf(isD(tar) ? tar : tod(), stBas(st));

    const a = Math.min(tut, Math.max(0, o.borc)), rest = tut - a, b = Math.min(rest, Math.max(0, o.avans));
    add("borc", -a); add("avans", -b); add("borc", -(rest - b));

    faiz = Math.min(tut, dueFaiz(o.kalan, o, per, st));

    ana = Math.min(o.kalan, tut - faiz);
    add("kalan", -ana);

/* Ödeme / gelir onayını geri alır: borç ve hesap eski haline döner, mahsup edilen avanslar serbest kalır */
/* GERİ ALMA KURALLARI (23.10.2026):
   · Ters kayıt, geri aldığı hareketin TARİHİYLE yazılır (oluşturulma anı t ayrıca saklanır): böylece hem o dönemin göstergeleri hem de
     bakiye geçmişi düzelir. (Bu kuraldan önce yazılmış ters kayıtların tarihi değiştirilmez.)
   · Kart: ödemeden sonra ekstre girildiyse ya da kart borcu elle değiştirildiyse (undoPayEffect.ekstreSonra) kart borcu ve avansı

  if (o) { if (!kartKorun) Object.entries(x.fx || {}).forEach(([f, d]) => { if (typeof o[f] === "number") o[f] -= d }); o.t = now }
  if (x.led) { const l = st.led.find(y => y.id === x.led); if (l) post(l.acc, -l.d, "ters", "Geri alındı: " + l.ac, l.tar, l.id, st) }

/* Yeni harcamanın etkileri: hesap bakiyesi, kart borcu (harcama esas mod) veya taksit detayı */
function applyHar(h, st = S) {

  if (h.yon !== "kart") return;

/* Ekstre kaydı: yeni dönemse taksitler bir ilerler */
function ekSave(o, v, st = S) {

  // Kesimden sonraki taksitli alım bu ekstreye girmez (harIn ile aynı sınır: kesim günü dahil); harcamaya bağlı olmayan elle girilmiş taksit eskisi gibi ilerler
  const girdi = t => { const h = arr(st.har).find(x => x.tk === t.id); return !h || !isD(h.tar) || h.tar <= kes };
  if (o.ekst !== per) tksOf(o, st).filter(girdi).forEach(t => { t.no += 1; t.t = now });

/* Kart borcu yapılandırma: tutar krediye dönüşür; tamamıysa kart eski kayıt olur */
function yapApply(o, tut, vade, faiz, st = S) {
  const a = annuity(tut, faiz, vade, st.p), now = Date.now();
  if (!a) return null;
  const l = clean("loans", {id: uid(), t: now, c: now, bank: o.bank, tur: "Kart yapılandırma", bas: tod(), ilk: tut, kalan: tut, oran: faiz, per: "a", taksit: a.taksit, vade, kal: vade, gun: o.sonOdeme, yapKart: o.id});
  st.loans.push(l);
  const bal = cardDebt(o);
  if (tut >= bal) o.out = true;
  else { const b = Math.min(tut, Math.max(0, o.borc)); o.borc -= b; o.avans -= Math.min(tut - b, o.avans) }
  o.yap = "yapilandirilmis"; o.t = now;
  logA("ekle", "loans", o.bank + " kart yapılandırma · " + tlR(tut) + " · " + vade + " ay", st);
  return l;
}

/* ---------- [ÇEKİRDEK] Gelir ve sabit gider onayları ---------- */
/* Bu ve geçen takvim ayındaki vade tarihleri: bugüne kadar gelmiş ve onay başlangıcından sonraki */
/* Sabit gider bu vade tarihinde ödenir mi: belirli döneme ait mi, yıllıksa doğru ay mı */

    if (s <= t && s >= (o.ob || "") && expIn(o, s)) r.push(s); // gelirlerde ay/ysk yok → her ay
  });

}

/* ---------- [ÇEKİRDEK] Veri tutarlılığı denetçisi ----------
   Veriyi değiştirmez; bulgu listesi döner. Her bulgu: {sev: r (hata) | w (uyarı) | i (inceleme), kod, ad, ac (açıklama), kay (etkilenen kayıtlar),

    if (!l.length || l[0].once == null) return; // eski sürümden gelen başlangıçsız hareketlerde karşılaştırma yapılamaz
    const exp = toN(l[0].once) + sum(l, e => toN(e.d));

  live(st.alac).forEach(o => { if (o.top > 0 && o.kalan > o.top) add("w", "borc", o.kim + ": kalan alacak toplamdan büyük", "Kalan " + tlR(o.kalan) + ", toplam " + tlR(o.top) + ".", [o.kim], "Yanlış giriş.", "Alacağı düzenle.") });
  act(st.cards).forEach(o => { if (o.limit > 0 && cardBal(o, st) > o.limit * 1.2) add("w", "borc", o.bank + " kartı: borç limiti çok aşıyor", "Toplam borç " + tlR(cardBal(o, st)) + ", limit " + tlR(o.limit) + ".", [o.bank + " kartı"], "Ekstre ya da taksit bilgisi eski kalmış olabilir.", "Kartın son ekstresini gir veya taksitleri kontrol et.") });
  act(st.kmh).forEach(o => { if (o.kul < 0) add("w", "borc", o.bank + " KMH: kullanılan tutar eksi", "Kullanılan " + tlR(o.kul) + ".", [o.bank + " KMH"], "Fazla ödeme işlenmiş.", "KMH'yi düzenle.") });
  // 6. Birikim: miktar, maliyet, değer

    if (UNIT.includes(b.tur) && !(b.mik > 0) && b.alis > 0) add("i", "bir", b.ad + ": miktar sıfır", "Birim fiyatı var ama miktarı yok; değeri 0 görünür.", [b.ad], "Miktar girilmemiş.", "Kalemi düzenleyip miktarı gir.");
    if (DEP.includes(b.tur) && b.ana > 0 && !(b.vade > 0)) add("w", "bir", b.ad + ": vade gün sayısı yok", "Mevduatın vadesi girilmemiş; getiri hesaplanmaz.", [b.ad], "Eksik giriş.", "Kalemi düzenleyip vadeyi gir.");
    const f = arr(b.fiy); if (f.some(e => !(e.f > 0))) add("i", "bir", b.ad + ": sıfır fiyat girişi", "Fiyat geçmişinde 0 TL'lik giriş var; o tarihte değeri 0 görünür.", [b.ad], "Yanlış giriş.", "Kalemin fiyat geçmişini düzelt.");
  });

}
/* Onaylı düzeltme: yalnızca fix tanımı olan bulgular; değişiklik işlem kaydına yazılır */
function auditFix(f, st = S) {
  if (!f || !f.fix) return false;

    (st.led = st.led || []).push({id: uid(), t: Date.now(), tar: tod(), acc: a.id, tip: "duzeltme", d: f.fix.d, ac: "Veri denetimi: bakiye–hareket farkı düzeltmesi", once: a.bak - f.fix.d, sonra: a.bak, ref: ""});

}

/* ---------- [ÇEKİRDEK] Ekler: fiş / fatura fotoğrafları ----------
   localStorage (~5 MB) fotoğraf için yetmez; fotoğraflar IndexedDB'de, verinin PIN anahtarıyla AES-GCM şifreli saklanır.
   Kayıt anahtarı "<profil>:<ek kimliği>"; harcama kaydında yalnızca ek kimliği (foto) ve garanti bitiş tarihi (gar) tutulur.
   Yedeğe dahil etmek isteğe bağlıdır ("fotoğrafları da yedekle"). */
const EK_DB = "fp-ek", EK_MAX = 200 * 1024; // küçültülmüş fotoğraf için hedef üst sınır (bayt)
let EKDB = null;
function ekDb() {
  if (EKDB) return EKDB;
  EKDB = new Promise((ok, no) => {
    if (!window.indexedDB) return no(new Error("Bu tarayıcı fotoğraf saklamayı desteklemiyor"));
    const r = indexedDB.open(EK_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("ek", {keyPath: "k"});
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
  EKDB.catch(() => { EKDB = null });
  return EKDB;
}
const ekTx = async (mode, f) => { const db = await ekDb(); return new Promise((ok, no) => { const tx = db.transaction("ek", mode), s = tx.objectStore("ek"), r = f(s); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => no(tx.error); tx.onabort = () => no(tx.error) }) };
async function ekPut(pid, id, key, data) { const e = await sealD(key, data); return ekTx("readwrite", s => s.put({k: pid + ":" + id, t: Date.now(), ...e})) }
async function ekGet(pid, id, key) { const e = await ekTx("readonly", s => s.get(pid + ":" + id)); return e ? openD(key, e) : null }
const ekDel = (pid, id) => ekTx("readwrite", s => s.delete(pid + ":" + id));
async function ekIds(pid) { const ks = await ekTx("readonly", s => s.getAllKeys()); return arr(ks).filter(k2 => String(k2).startsWith(pid + ":")).map(k2 => String(k2).slice(pid.length + 1)) }
async function ekClear(pid) { for (const id of await ekIds(pid)) await ekDel(pid, id) }
/* Fotoğrafı küçültür: uzun kenar en fazla 1400 px, JPEG; boyut sınırın altına inene kadar kalite / boyut düşürülür. Dönüş: data URL */
async function ekShrink(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error("Yalnızca fotoğraf dosyası eklenebilir");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("Fotoğraf açılamadı")); i.src = url });
    let side = 1400, q = .8, out = "";
    for (let n = 0; n < 8; n++) {
      const sc = Math.min(1, side / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL("image/jpeg", q);
      if (out.length * .75 <= EK_MAX) break;
      if (q > .5) q -= .15; else side = Math.round(side * .75);
    }
    return out;
  } finally { URL.revokeObjectURL(url) }
}
/* Yedek için: profilin tüm eklerini çözüp {id: dataURL} olarak verir; geri yüklemede yazar */
async function ekExport(pid, key) { const o = {}; for (const id of await ekIds(pid)) { const d = await ekGet(pid, id, key); if (d) o[id] = d } return o }
async function ekImport(pid, key, m) { let n = 0; for (const [id, d] of Object.entries(m || {})) if (safeId(id) === id && typeof d === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(d) && d.length < 4 * EK_MAX) { await ekPut(pid, id, key, d); n++ } return n }

/* ---------- [ÇEKİRDEK] v9: dayanıklılık, reel getiri, "alabilir miyim?", içgörüler, rozetler, döviz kuru ----------
   Hepsi açıklanabilir hesaplardır: sonuçla birlikte dayanağı (kullanılan rakamlar ve varsayımlar) döner. Tavsiye değildir; gerçek kayıtları değiştirmez. */

/* D2 — Gelir kesilirse dayanma süresi (ay): kasa (banka + nakit) [+ istenirse bozdurulabilir birikim] ÷ aylık zorunlu çıkış
   zorunlu çıkış = sabit giderler (kartla ödenenler hariç: onlar kart ödemesinde) + ortalama harcama (son 3 dönem) + borç ödemeleri (asgari / taksit) */
const LIKIT = ["vadeli", "katilim", "altin", "gumus", "maden", "doviz", "fon", "hisse"]; // BES ve "diğer" hızla nakde dönmez
function runway(st = S, withBir = false) {
  const s = stats(st), out = s.expC + s.harAvg + s.load, bir = withBir ? sum(live(st.bir).filter(b => LIKIT.includes(b.tur)), b => birVal(b)) : 0, cash = s.liq + bir;
  return {ay: out > 0 ? Math.max(0, cash) / out : null, cash, out, bir, f: "(kasa" + (withBir ? " + bozdurulabilir birikim" : "") + ") ÷ (sabit gider (kartla ödenenler hariç; kart ödemesinde) + ortalama harcama + borç ödemeleri)"};
}

/* D1 — Enflasyon ve reel getiri. enf: kullanıcının yıllık enflasyon varsayımı (%); haricî veri değildir.
   Reel = (1 + nominal) / (1 + enflasyon) − 1 ; dönem uzunluğuna göre bileşik. */
const reelOf = (nom, enf) => (1 + nom) / (1 + enf) - 1;
function birReel(b, enf, at = tod()) {
  const c = birCost(b), v = birVal(b, at), d0 = DEP.includes(b.tur) ? b.bas : b.alisTar;
  if (!(c > 0) || !isD(d0)) return null;
  const days = Math.max(1, Math.round((pDate(at) - pDate(d0)) / 864e5)), nom = v / c - 1, inf = Math.pow(1 + enf / 100, days / 365) - 1;
  return {days, nom, inf, reel: reelOf(nom, inf), yNom: Math.pow(1 + nom, 365 / days) - 1, c, v};
}
/* Mevduat: yıllık net (stopajlı) faiz ile enflasyon karşılaştırması */
const depReel = (b, enf) => reelOf(b.faiz / 100 * (1 - b.stopaj / 100), enf / 100);

/* D4 — "Bunu alabilir miyim?" v: {tut, yol: nakit | kart | taksit, n (taksit sayısı)}. Bugünkü verinin kopyası üzerinde hesaplanır. */
function canBuy(v, st = S) {
  const s = stats(st), tut = Math.max(0, Math.round(v.tut || 0)), n = v.yol === "taksit" ? Math.max(2, Math.min(36, Math.round(v.n) || 2)) : 1;
  const rw0 = runway(st), aylik = v.yol === "taksit" ? Math.ceil(tut / n) : 0;
  const r = {tut, yol: v.yol, n, aylik, rem0: s.rem, plan0: s.serbest, liq0: s.liq, avail: s.availC, run0: rw0.ay, out: rw0.out, notlar: []};
  if (v.yol === "nakit") { r.rem1 = s.rem - tut; r.liq1 = s.liq - tut; r.plan1 = s.serbest; r.run1 = rw0.out > 0 ? Math.max(0, r.liq1) / rw0.out : null }
  else { // kart: bu dönem kasadan çıkmaz; peşinse sonraki ekstreye, taksitliyse her ay taksit kadar
    r.rem1 = s.rem; r.liq1 = s.liq; r.run1 = rw0.out > 0 ? s.liq / (rw0.out + aylik) : null;
    r.plan1 = s.serbest - (v.yol === "taksit" ? aylik : 0);
    r.ekstre = v.yol === "kart" ? tut : aylik;
    if (tut > s.availC) r.notlar.push("Kartlardaki kullanılabilir limit (" + tlR(s.availC) + ") bu tutara yetmiyor.");
  }
  if (r.liq1 < 0) r.notlar.push("Kasadaki para bu tutara yetmiyor (" + tlR(r.liq1) + ").");
  if (r.rem1 < 0) r.notlar.push(GOST.kalan.ad + " eksiye düşüyor (" + tlR(r.rem1) + ").");
  if (r.run1 != null && r.run1 < 3) r.notlar.push("Gelir kesilirse dayanma süresi 3 ayın altına iniyor (" + r.run1.toFixed(1).replace(".", ",") + " ay).");
  if (v.yol === "taksit" && r.plan1 < 0) r.notlar.push(GOST.plan.ad + " taksit süresince eksiye düşüyor.");
  if (r.plan0 > 0 && v.yol !== "taksit") r.ayEq = tut / r.plan0; // kaç aylık serbest nakde denk
  r.durum = r.liq1 < 0 || (v.yol !== "nakit" && tut > s.availC) ? "zor" : r.notlar.length ? "dikkat" : "rahat";
  r.varsayim = "Bugünkü kayıtlar; bu dönemin gelir ve giderleri; son 3 dönemin ortalama harcaması; kart harcaması kasadan ekstre ödemesiyle çıkar; faiz ve fiyat değişimi yok.";
  return r;
}

/* C4 — Önümüzdeki 7 gün: yaklaşan ödemeler (gecikmişler dahil) ile kasa (banka + nakit). İhtiyatlı: beklenen gelir ödeme gününden sonra gelebileceği için eksik hesabına katılmaz, yalnızca bilgi olarak verilir */
function next7(items, st = S) {
  const out = sum(items.filter(c => c[0] <= 7 && c[2] < 0), c => -c[2]), inc = sum(items.filter(c => c[0] >= 0 && c[0] <= 7 && c[2] > 0), c => c[2]), liq = sum(act(st.acc), a => a.bak);
  return {out, inc, liq, eksik: Math.max(0, out - liq)};
}

/* E1 — Harcama içgörüleri: bulgu · kanıt · etki · öneri · belirsizlik. En fazla 3, yeterli veri yoksa üretilmez. */
function insights(st = S) {
  const cp = stCP(st), hl = live(st.har).filter(h => !h.gid), cur = hl.filter(h => perOf(h.tar, stBas(st)) === cp), I = [];
  const byK = l => { const m = {}; l.forEach(h => m[h.kat] = (m[h.kat] || 0) + h.tut); return m };
  const prev = [1, 2, 3].map(i => byK(hl.filter(h => perOf(h.tar, stBas(st)) === perAdd(cp, -i)))), pn = prev.filter(p => Object.keys(p).length).length, ck = byK(cur);
  if (pn >= 2) Object.entries(ck).forEach(([kat, v]) => {
    const avg = sum(prev, p => p[kat] || 0) / pn;
    if (avg > 0 && v > avg * 1.25 && v - avg >= k(200)) I.push({puan: v - avg, ad: kat + " harcaman ortalamanın üstünde", kanit: "Bu dönem " + tlR(v) + ", son " + pn + " dönemin ortalaması " + tlR(Math.round(avg)) + " (%" + Math.round((v / avg - 1) * 100) + " fazla).", etki: "Fark " + tlR(Math.round(v - avg)) + "; bu, " + GOST.plan.ad.toLocaleLowerCase("tr") + "inden düşer.", oneri: kat + " için bütçe belirleyip 'aşılınca uyar'ı açabilirsin.", bel: "Dönem bitmedi; tek seferlik büyük bir alışveriş ortalamayı yanıltabilir."});
  });
  const sm = {};
  cur.filter(h => h.tut < k(150)).forEach(h => { sm[h.kat] = sm[h.kat] || {n: 0, t: 0}; sm[h.kat].n++; sm[h.kat].t += h.tut });
  Object.entries(sm).forEach(([kat, x]) => { if (x.n >= 6) I.push({puan: x.t, ad: kat + ": sık küçük harcamalar", kanit: "Bu dönem " + x.n + " kez 150 TL altı, toplam " + tlR(x.t) + ".", etki: "Yıllık karşılığı yaklaşık " + tlR(x.t * 12) + ".", oneri: "İstersen haftalık bir üst sınır belirleyebilirsin.", bel: "Bilinçli tercihler olabilir; yalnızca farkındalık içindir."}) });
  const ab = live(st.expense).filter(o => o.abo), am = sum(ab, o => o.ysk === "yil" ? Math.round(o.tut / 12) : o.tut);
  if (ab.length >= 2) I.push({puan: am / 2, ad: ab.length + " abonelik: aylık " + tlR(am), kanit: "Yıllık toplam " + tlR(sum(ab, o => o.ysk === "yil" ? o.tut : o.tut * 12)) + ".", etki: "Bir abonelik kapatılırsa her ay o tutar kadar nakit serbest kalır.", oneri: "Listeyi Giderler → Abonelikler'de görebilirsin.", bel: "Tutarlar kayıtlara dayanır; fiyat artışları yansımamış olabilir."});
  return I.sort((a, b) => b.puan - a.puan).slice(0, 3);
}

/* E2 — Rozetler: yalnızca motivasyon içindir, hiçbir hesabı etkilemez; Ayarlar'dan kapatılabilir */
function badges(st = S) {
  const rw = runway(st), cp = stCP(st), birP = i => sum(live(st.trn).filter(x => x.tur === "bir" && perOf(x.tar, stBas(st)) === perAdd(cp, -i)), x => x.tut) > 0;
  let seri = 0; for (let i = 1; i <= 12 && birP(i); i++) seri++;
  const pp = perAdd(cp, -1), bk = Object.keys(st.bt || {}).filter(x => st.bt[x] > 0), sp = x => sum(live(st.har).filter(h => h.kat === x && perOf(h.tar, stBas(st)) === pp), h => h.tut);
  const kapandi = [...live(st.loans), ...live(st.elden)].some(o => o.kalan <= 0 && live(st.odm).some(x => x.ref === o.id));
  return [

    ["🎯", "Bütçe içinde bir dönem", bk.length > 0 && bk.every(x => sp(x) <= st.bt[x]), "Geçen dönem tüm bütçeli kategorilerde sınırın altında kal"],
    ["🔓", "Bir borç kapandı", kapandi, "Bir krediyi ya da elden borcu tamamen öde"]
  ].map(x => ({ik: x[0], ad: x[1], ok: !!x[2], nasil: x[3]}));
}

/* C3 — İsteğe bağlı döviz kuru (Frankfurter / Avrupa Merkez Bankası referans kurları). Varsayılan kapalı; yalnızca kur sorgusu gönderilir.
   Kayıtlara "kay: ecb" işaretli fiyat girişi olarak eklenir (kullanıcı girişlerinden ayrı); alınamazsa hiçbir kayıt değişmez. */
const KUR_URL = [c => "https://api.frankfurter.dev/v1/latest?base=" + c + "&symbols=TRY", c => "https://api.frankfurter.app/latest?from=" + c + "&to=TRY"];
async function fetchKur(cur) {
  if (!/^[A-Z]{3}$/.test(cur)) throw new Error("Geçersiz para birimi: " + cur);
  let err;
  for (const u of KUR_URL) {
    try {
      const r = await fetch(u(cur), {cache: "no-store", referrerPolicy: "no-referrer", credentials: "omit"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(), f = j && j.rates && +j.rates.TRY;
      if (!(f > 0) || !isD(j.date)) throw new Error("Beklenmeyen yanıt");
      return {f, tar: j.date};
    } catch (e) { err = e }
  }
  throw err || new Error("Kur alınamadı");
}
async function updKur(st = S) {
  const l = live(st.bir).filter(b => b.tur === "doviz" && /^[A-Z]{3}$/.test(b.pb || "") && b.pb !== "TRY"), cs = [...new Set(l.map(b => b.pb))], got = {}, bad = [];
  for (const c of cs) { try { got[c] = await fetchKur(c) } catch (e) { bad.push(c + " (" + (e.message || "hata") + ")") } }
  let n = 0;
  l.forEach(b => {
    const g = got[b.pb]; if (!g) return;
    b.fiy = arr(b.fiy).filter(e => !(e.tar === g.tar && e.kay === "ecb"));
    b.fiy.push({tar: g.tar, f: Math.round(g.f * 100), kay: "ecb"}); b.fiy.sort((x, y) => x.tar.localeCompare(y.tar)); b.t = Date.now(); n++;
  });
  if (n) { st.set.kurT = Date.now(); logA("fiyat", "bir", "Döviz kuru güncellendi (ECB): " + Object.keys(got).join(", "), st) }
  return {n, got, bad};
}

/* ---------- [ÇEKİRDEK] v11: nakit akışı tahmin motoru ----------
   Kasa (banka + nakit) bugünden itibaren gün gün öngörülür. Gerçek kayıtları değiştirmez.
   Çift sayım kuralları: kartla ödenen sabit gider kasadan değil kart ekstresinden çıkar; kart harcaması kart ödemesiyle yansır;
   bu dönem ödenmiş taksit / onaylanmış gelir / işlenmiş gider tekrar sayılmaz. Kesin kalemler (kayıtlı plan ve yükümlülükler) ile
   ortalamaya dayalı tahminler (değişken harcama, gelecek ekstreler) ayrı işaretlenir. */
const dPlus = (s, n) => { const d = pDate(s); d.setDate(d.getDate() + n); return fmtD(d) };
const dDiff = (a, b) => Math.round((pDate(b) - pDate(a)) / 864e5);
/* Dönemin son günü (ay başlangıcı ayarına göre) */
const perEnd = (per, bas = 1) => { const d = mDay(+per.slice(0, 4), +per.slice(5, 7), bas); d.setDate(d.getDate() - 1); return fmtD(d) }; // sonraki dönemin ilk gününden bir önceki gün

    for (let mo = 0; mo < months; mo++) {
      const s = md(mo, o.gun);

      if (cash) add(s, o.ad, -o.tut, "gider", true);

}
/* Dönem başında bir kez tahmin kaydı alınır: dönem sonu için öngörülen kasa. Dönem bitince gerçekleşenle karşılaştırılır */

/* ---------- [ÇEKİRDEK] v12: finansal karar laboratuvarı ----------

// Senaryoda eklenen gelir / giderler yarından başlar (bu ayın geçmiş günleri 'bekleyen' sayılmaz)

/* Senaryonun ölçütleri (12 ay ufku). Net varlık 12 ay sonra ≈ bugünkü net + 12 × (gelir + tahsilat − sabit gider − ortalama harcama) − ilk 12 ayın borç faizi

  const pw = await askPw("Yedek şifresi belirle", true);
  if (!pw) return null;
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await dk(pw, salt, BK_IT);
  let data = S;
  if (ph) { try { data = {...S, ek: await ekExport(P.id, KEY)} } catch (e) { if (!confirm("Fotoğraflar okunamadı (" + errTxt(e) + "). Fotoğrafsız yedek alınsın mı?")) return null } }
  return new Blob([JSON.stringify({fp: 2, it: BK_IT, salt: b64(salt), ...await sealD(key, JSON.stringify(data))})], {type: "application/json"});
}
/* Dosyayı kaydettirir: Claude çalışma ortamında indirme izniyle, tarayıcıda kaydet penceresiyle ya da indirme bağlantısıyla.
   Dönüş: true = yazıldı (indirme bağlantısında tarayıcıya teslim edildi; sonucunu tarayıcı bildirmez), false = vazgeçildi / yazılamadı */
async function saveBlob(b, name, mime, ext) {
  if (window.claude && window.claude.use) {
    let dl = null;
    try { dl = await claude.use("downloads") } catch (e) {}
    if (dl) {
      try { await dl.save({filename: name, data: b}); return true }
      catch (e) {
        if (e && e.code === "rate_limited") alert("Önceki kaydetme penceresi hâlâ açık. Biraz sonra tekrar dene.");
        else if (!(e && e.code === "declined")) alert("Dosya kaydedilemedi (" + ((e && e.code) || "hata") + ").");
      }
      return false;
    }
  }
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({suggestedName: name, types: [{accept: {[mime]: ["." + ext]}}]}), w = await h.createWritable();
      await w.write(b);
      await w.close();
      return true;
    }
  } catch (e) { if (e.name === "AbortError") return false }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
async function saveFile(b, ph) {
  b = b || await blob(ph);
  if (!b) return false;
  const ok = await saveBlob(b, fn(), "application/json", "json");
  if (!ok) return false; // vazgeçildi ya da yazılamadı: yedek hatırlatması sıfırlanmaz
  S.set.sonYedek = Date.now(); // yedek hatırlatması için
  logA("yedek", "veri", "Şifreli yedek alındı" + (ph ? " (fotoğraflarla)" : ""));
  save();
  return true;
}
async function readBackup(text) {
  let x = JSON.parse(text);
  if (x && x.fp) {
    const pw = await askPw("Yedek dosyasını aç", false);
    if (!pw) return null;
    const it = Math.min(Math.max(toN(x.it) || PIN_IT, 1000), 5000000); // dosyadan gelen değer sınırlanır
    x = JSON.parse(await openD(await dk(pw, ub(x.salt), it), x));
  }
  return x;
}

  x = mig(x);
  let yeni = 0, guncel = 0;
  COLL.forEach(c => { const m = new Map((S[c] || []).map(r => [r.id, r])); (x[c] || []).forEach(r => { const l = m.get(r.id); if (!l) yeni++; else if ((r.t || 0) > (l.t || 0)) guncel++ }) });
  const nek = ek ? Object.keys(ek).length : 0;
  if (!yeni && !guncel && !nek) return alert("Yedekteki kayıtların hepsi zaten burada ve güncel. Değişiklik yapılmadı.");

  if (RO || lockOther()) return alert("Veri şu an başka bir sekmede açık; bu sekme salt okunur. Yedek birleştirilmedi.");
  try { mkBk(P, DATA_V) } catch (e) { if (!confirm("Şimdiki verinin yedeği alınamadı (" + errTxt(e) + "). Yine de birleştirilsin mi?")) return }
  if (x.set && x.set.sonYedek > (S.set.sonYedek || 0)) S.set.sonYedek = x.set.sonYedek;
  COLL.forEach(c => {
    const m = new Map((S[c] || []).map(r => [r.id, r]));
    (x[c] || []).forEach(r => { const l = m.get(r.id); if (!l || (r.t || 0) > (l.t || 0)) m.set(r.id, r) });
    S[c] = [...m.values()];
  });
  S.kat = [...new Set((S.kat || []).concat(x.kat))];
  S.snap = {...x.snap, ...S.snap};
  if (x.t > S.t) { S.p = x.p; S.bt = x.bt; S.btU = x.btU }
  logA("yedek", "veri", "Yedek dosyası birleştirildi (" + yeni + " yeni, " + guncel + " güncel)");
  if (nek) { try { await ekImport(P.id, KEY, ek) } catch (e) { alert("Fotoğraflar yüklenemedi: " + errTxt(e)) } }
  save();
  render();
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.tagName === "SELECT" && t.dataset.nw) { if (t.value === "__new") return openNw(t); t.dataset.pv = t.value }
  if (t.id === "lf") { LF = t.value; render(); return }
  if (t.id === "af") { AF = t.value; render(); return }
  if (t.id === "fi" && t.files[0]) {
    const r = new FileReader();
    r.onload = async () => {
      t.value = ""; // aynı dosya tekrar seçilebilsin
      try { const x = await readBackup(r.result); if (x) merge(x) }
      catch (_) { alert("Dosya açılamadı: şifre yanlış veya dosya bozuk.") }
    };
    r.readAsText(t.files[0]);
  }
});

  $("#app").innerHTML = safetyBanner() + (gy > S.set.hat ? '<div class="w" style="margin-bottom:8px">Son yedek ' + Math.floor(gy) + ' gün önce. <button class="sm" data-a="myedek">Yedek al</button></div>' : "") + (MV[MT] || mOz)();
  const np = mPend().length;
  document.querySelectorAll("#tb button").forEach(x => x.classList.toggle("on", x.dataset.t === MT));
  $('#tb [data-t="onay"] span').innerHTML = "Onaylar" + (np ? ' <span class="nb">' + np + '</span>' : "");
  if (q) nextTask();
}
applyTheme();
// Web adresinden açılınca (ör. GitHub Pages) uygulama çevrimdışı çalışsın ve ana ekrana eklenebilsin: manifest + service worker yalnızca http(s)'de
if (/^https?:/.test(location.protocol)) {
  try { const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l) } catch (e) {}
  if (navigator.serviceWorker) navigator.serviceWorker.register("sw.js").catch(() => {});
}
setTimeout(() => { L.splash = false; render() }, 900);
render();

</script>
